openapi: 3.1.0
info:
  title: Omni Commerce API
  version: 0.0.0
  description: Contract stub — full schema and codegen in a later task.
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /v1/orgs:
    get:
      summary: List orgs for current user
      responses:
        '200':
          description: OK
    post:
      summary: Create org
      responses:
        '201':
          description: Created
  /v1/channels:
    get:
      summary: List channel connections for current org
      responses:
        '200':
          description: OK
  /v1/channels/meta/oauth-url:
    get:
      summary: Build Meta OAuth connect URL
      responses:
        '200':
          description: OK
  /v1/channels/meta/complete:
    post:
      summary: Complete Meta OAuth and connect pages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        '201':
          description: Created
  /v1/channels/{id}/revoke:
    post:
      summary: Revoke a channel connection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Revoked
  /ops/v1/orgs:
    get:
      summary: List orgs (platform admin)
      responses:
        '200':
          description: OK
  /internal/v1/ai/health:
    get:
      summary: Proxy AI health (service key)
      responses:
        '200':
          description: OK
