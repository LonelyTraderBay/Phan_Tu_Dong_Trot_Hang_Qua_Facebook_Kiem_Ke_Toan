openapi: 3.1.0
info:
  title: Omni Commerce API
  version: 0.0.0
  description: Contract stub — full schema and codegen in a later task.
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /v1/orgs:
    get:
      summary: List orgs for current user
      responses:
        '200':
          description: OK
    post:
      summary: Create org
      responses:
        '201':
          description: Created
  /v1/orgs/me/export:
    post:
      summary: Export a practical PDPA JSON bundle for the current org
      responses:
        '200':
          description: Export bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdpaExportBundle'
        '403':
          description: Owner permission required
  /v1/orgs/me/delete-request:
    post:
      summary: Record a pending PDPA delete/anonymize request for the current org
      responses:
        '202':
          description: Delete request recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdpaDeleteRequestResponse'
        '403':
          description: Owner permission required
  /v1/channels:
    get:
      summary: List channel connections for current org
      responses:
        '200':
          description: OK
  /v1/channels/meta/oauth-url:
    get:
      summary: Build Meta OAuth connect URL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
  /v1/channels/meta/complete:
    post:
      summary: Complete Meta OAuth and connect pages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - state
              properties:
                code:
                  type: string
                state:
                  type: string
      responses:
        '201':
          description: Created
  /v1/channels/{id}/revoke:
    post:
      summary: Revoke a channel connection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Revoked
  /v1/shipping/connections:
    get:
      summary: List carrier connections for current org
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCarrierConnectionsResponse'
    post:
      summary: Upsert one carrier connection for current org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCarrierConnectionRequest'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierConnectionEnvelope'
  /v1/shipping/shipments:
    get:
      summary: List shipments for an order
      parameters:
        - name: orderId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListShipmentsResponse'
    post:
      summary: Create a shipment for a confirmed or shipped order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        '201':
          description: Shipment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShipmentResponse'
        '400':
          description: Carrier not configured, disabled, or invalid order status
  /v1/cod/report:
    get:
      summary: List open COD expectations, open discrepancies, and summary totals
      responses:
        '200':
          description: COD reconciliation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodReportResponse'
  /v1/cod/collections:
    post:
      summary: Record a COD collection event for one order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCodCollectionRequest'
      responses:
        '201':
          description: COD collection recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodCollectionEnvelope'
        '404':
          description: COD expectation not found for order
  /v1/cod/reconcile:
    post:
      summary: Reconcile one COD order expected amount against collected events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileCodOrderRequest'
      responses:
        '200':
          description: COD order reconciled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodReconcileResponse'
        '404':
          description: COD expectation not found for order
  /v1/cod/reconcile/batch:
    post:
      summary: Reconcile a batch of COD orders, or all open COD expectations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileCodBatchRequest'
      responses:
        '200':
          description: COD batch reconciled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodReconcileBatchResponse'
  /v1/inventory/movements:
    get:
      summary: List stock movements for current org
      parameters:
        - name: variantId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: OK
  /v1/inventory/low-stock:
    get:
      summary: List variants at or below low-stock threshold
      parameters:
        - name: threshold
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: OK
  /v1/inventory/adjust:
    post:
      summary: Adjust variant stock and write ledger row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - variantId
                - qtyDelta
              properties:
                variantId:
                  type: string
                  format: uuid
                qtyDelta:
                  type: integer
                reason:
                  type: string
                movementType:
                  type: string
                  enum:
                    - adjust
                    - inbound
                    - outbound
      responses:
        '201':
          description: Adjusted
        '200':
          description: Adjusted
  /v1/catalog/products:
    get:
      summary: List products for current org
      responses:
        '200':
          description: OK
    post:
      summary: Create product with optional variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                description:
                  type:
                    - string
                    - 'null'
                status:
                  type: string
                  enum:
                    - active
                    - archived
                attrs:
                  type: object
                  additionalProperties: true
                variants:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProductVariantWrite'
      responses:
        '201':
          description: Created
  /v1/catalog/products/{productId}:
    get:
      summary: Get product with variants
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: OK
    patch:
      summary: Update product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Updated
    delete:
      summary: Soft-delete product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Deleted
  /v1/catalog/products/{productId}/variants:
    post:
      summary: Create product variant
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVariantWrite'
      responses:
        '201':
          description: Created
  /v1/catalog/products/{productId}/variants/{variantId}:
    patch:
      summary: Update product variant
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete product variant
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
      responses:
        '200':
          description: Deleted
  /v1/orders:
    get:
      summary: List orders for current org
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersResponse'
    post:
      summary: Create a staff draft order
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftOrderRequest'
      responses:
        '201':
          description: Draft order created, or confirmed when org settings auto_confirm is true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid request or insufficient stock during auto-confirm
  /v1/orders/{orderId}:
    get:
      summary: Get one order with items
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
  /v1/orders/{orderId}/confirm:
    post:
      summary: Confirm an order and atomically decrement stock
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order status or insufficient stock
  /v1/orders/{orderId}/cancel:
    post:
      summary: Cancel an order; confirmed unshipped orders restore stock
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /v1/orders/{orderId}/ship:
    post:
      summary: Mark a confirmed order as shipped
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Shipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /v1/orders/export:
    get:
      summary: Export orders for current org as xlsx, csv, or pdf
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum:
              - csv
              - xlsx
              - pdf
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: createdFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Export file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid query
  /v1/inbox/conversations:
    get:
      summary: List inbox conversations for current org
      responses:
        '200':
          description: OK
  /v1/inbox/conversations/{id}/messages:
    get:
      summary: List inbox messages for a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /v1/inbox/conversations/{id}/takeover:
    post:
      summary: Pause bot and take over an inbox conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Taken over
  /v1/webhooks/meta:
    get:
      summary: Verify Meta webhook subscription
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plain text challenge
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Invalid verify token
    post:
      summary: Ingest Meta webhook events
      parameters:
        - name: x-hub-signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
        '401':
          description: Invalid signature
  /ops/v1/orgs:
    get:
      summary: List orgs (platform admin)
      responses:
        '200':
          description: OK
  /ops/v1/orgs/{orgId}/plan:
    patch:
      summary: Update organization plan and sync entitlements (platform admin)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgPlanRequest'
      responses:
        '200':
          description: Organization plan updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrgPlanResponse'
        '400':
          description: Invalid plan or org id
        '403':
          description: Platform admin required
        '404':
          description: Organization not found
  /internal/v1/ai/health:
    get:
      summary: Proxy AI health (service key)
      responses:
        '200':
          description: OK
  /internal/v1/ai/runs:
    post:
      summary: Persist an AI run after Core receives an AI response (service key)
      parameters:
        - name: x-service-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteAiRunRequest'
      responses:
        '201':
          description: AI run written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteAiRunResponse'
        '400':
          description: Invalid request or model not allowed
        '401':
          description: Invalid service key
  /internal/v1/tools/get-product:
    post:
      summary: Get one product with variants for AI tooling (service key)
      parameters:
        - name: x-service-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGetProductRequest'
      responses:
        '201':
          description: Product returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGetProductResponse'
        '401':
          description: Invalid service key
        '404':
          description: Product not found for organization
  /internal/v1/tools/create-draft-order:
    post:
      summary: Create a draft order from catalog variants for AI tooling (service key)
      parameters:
        - name: x-service-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiCreateDraftOrderRequest'
      responses:
        '201':
          description: Draft order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCreateDraftOrderResponse'
        '400':
          description: Invalid request or draft total over AI maximum
        '401':
          description: Invalid service key
        '404':
          description: Organization, product, contact, or conversation not found
  /internal/v1/knowledge/chunks:
    post:
      summary: Atomically replace RAG chunks for one knowledge source (service key)
      parameters:
        - name: x-service-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceKnowledgeChunksRequest'
      responses:
        '201':
          description: Chunks replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceKnowledgeChunksResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid service key
        '404':
          description: Knowledge source not found for organization
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    PlanSlug:
      type: string
      enum:
        - free
        - pilot
        - starter
        - enterprise
    Entitlements:
      type: object
      required:
        - orgId
        - maxPages
        - aiMonthlyTokenLimit
        - autoConfirmAllowed
        - updatedAt
      properties:
        orgId:
          type: string
          format: uuid
        maxPages:
          type: integer
          minimum: 0
        aiMonthlyTokenLimit:
          type: integer
          minimum: 0
        autoConfirmAllowed:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    UpdateOrgPlanRequest:
      type: object
      required:
        - plan
      properties:
        plan:
          $ref: '#/components/schemas/PlanSlug'
      additionalProperties: false
    UpdateOrgPlanResponse:
      type: object
      required:
        - organization
        - entitlements
      properties:
        organization:
          type: object
          additionalProperties: true
        entitlements:
          $ref: '#/components/schemas/Entitlements'
    PdpaExportBundle:
      type: object
      required:
        - exportedAt
        - orgId
        - generatedByUserId
        - organization
        - memberships
        - contacts
        - conversations
        - orders
      properties:
        exportedAt:
          type: string
          format: date-time
        orgId:
          type: string
          format: uuid
        generatedByUserId:
          type: string
          format: uuid
        organization:
          type: object
          additionalProperties: true
        memberships:
          type: array
          items:
            type: object
            additionalProperties: true
        contacts:
          type: array
          items:
            type: object
            additionalProperties: true
        conversations:
          type: array
          description: Conversation summaries only; message bodies are excluded.
          items:
            type: object
            additionalProperties: true
        orders:
          type: array
          items:
            type: object
            additionalProperties: true
    PdpaDeleteRequest:
      type: object
      required:
        - orgId
        - status
        - requestedByUserId
        - requestedAt
      properties:
        orgId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
        requestedByUserId:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
    PdpaDeleteRequestResponse:
      type: object
      required:
        - deleteRequest
      properties:
        deleteRequest:
          $ref: '#/components/schemas/PdpaDeleteRequest'
    KnowledgeChunkWrite:
      type: object
      required:
        - chunkIndex
        - content
        - contentHash
        - embedding
      properties:
        chunkIndex:
          type: integer
          minimum: 0
        content:
          type: string
          minLength: 1
          maxLength: 20000
        contentHash:
          type: string
          minLength: 1
          maxLength: 128
        embedding:
          type: array
          minItems: 768
          maxItems: 768
          items:
            type: number
            format: double
    ReplaceKnowledgeChunksRequest:
      type: object
      required:
        - orgId
        - sourceType
        - sourceId
        - chunks
      properties:
        orgId:
          type: string
          format: uuid
        sourceType:
          type: string
          enum:
            - product
            - faq
            - policy
        sourceId:
          type: string
          format: uuid
        chunks:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/KnowledgeChunkWrite'
    ReplaceKnowledgeChunksResponse:
      type: object
      required:
        - ok
        - deletedOld
        - inserted
      properties:
        ok:
          type: boolean
        deletedOld:
          type: boolean
        inserted:
          type: integer
          minimum: 0
    ProductVariantWrite:
      type: object
      required:
        - sku
        - title
        - priceVnd
      properties:
        sku:
          type: string
        title:
          type: string
        priceVnd:
          oneOf:
            - type: string
              pattern: '^[0-9]+$'
            - type: integer
              format: int64
          description: Whole VND amount; floats are not accepted.
        stockQty:
          type: integer
          minimum: 0
        attrs:
          type: object
          additionalProperties: true
    OrderStatus:
      type: string
      enum:
        - draft
        - confirmed
        - shipped
        - done
        - cancelled
        - returned
    OrderItemWrite:
      type: object
      required:
        - variantId
        - qty
      properties:
        variantId:
          type: string
          format: uuid
        qty:
          type: integer
          minimum: 1
          maximum: 999
    CreateDraftOrderRequest:
      type: object
      required:
        - items
      properties:
        conversationId:
          type:
            - string
            - 'null'
          format: uuid
        contactId:
          type:
            - string
            - 'null'
          format: uuid
        paymentMethod:
          type: string
          enum:
            - cod
            - bank_transfer
            - other
          default: cod
        customerName:
          type:
            - string
            - 'null'
        phoneE164:
          type:
            - string
            - 'null'
          pattern: '^\+[1-9][0-9]{1,14}$'
        addressText:
          type:
            - string
            - 'null'
        addressJson:
          type: object
          additionalProperties: true
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemWrite'
    OrderItem:
      type: object
      required:
        - id
        - productId
        - variantId
        - titleSnapshot
        - skuSnapshot
        - qty
        - unitPriceVnd
        - lineTotalVnd
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        titleSnapshot:
          type: string
        skuSnapshot:
          type: string
        qty:
          type: integer
          minimum: 1
        unitPriceVnd:
          type: string
          pattern: '^[0-9]+$'
          description: Whole VND amount as a bigint string.
        lineTotalVnd:
          type: string
          pattern: '^[0-9]+$'
          description: Whole VND amount as a bigint string.
    Order:
      type: object
      required:
        - id
        - status
        - paymentMethod
        - currency
        - subtotalVnd
        - shippingFeeVnd
        - totalVnd
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        conversationId:
