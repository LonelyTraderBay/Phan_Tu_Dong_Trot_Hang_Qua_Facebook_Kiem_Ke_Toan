openapi: 3.1.0
info:
  title: Omni Commerce API
  version: 0.0.0
  description: Contract stub — full schema and codegen in a later task.
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /v1/orgs:
    get:
      summary: List orgs for current user
      responses:
        '200':
          description: OK
    post:
      summary: Create org
      responses:
        '201':
          description: Created
  /v1/channels:
    get:
      summary: List channel connections for current org
      responses:
        '200':
          description: OK
  /v1/channels/meta/oauth-url:
    get:
      summary: Build Meta OAuth connect URL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
  /v1/channels/meta/complete:
    post:
      summary: Complete Meta OAuth and connect pages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - state
              properties:
                code:
                  type: string
                state:
                  type: string
      responses:
        '201':
          description: Created
  /v1/channels/{id}/revoke:
    post:
      summary: Revoke a channel connection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Revoked
  /v1/catalog/products:
    get:
      summary: List products for current org
      responses:
        '200':
          description: OK
    post:
      summary: Create product with optional variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                description:
                  type:
                    - string
                    - 'null'
                status:
                  type: string
                  enum:
                    - active
                    - archived
                attrs:
                  type: object
                  additionalProperties: true
                variants:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProductVariantWrite'
      responses:
        '201':
          description: Created
  /v1/catalog/products/{productId}:
    get:
      summary: Get product with variants
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: OK
    patch:
      summary: Update product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Updated
    delete:
      summary: Soft-delete product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Deleted
  /v1/catalog/products/{productId}/variants:
    post:
      summary: Create product variant
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVariantWrite'
      responses:
        '201':
          description: Created
  /v1/catalog/products/{productId}/variants/{variantId}:
    patch:
      summary: Update product variant
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete product variant
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
      responses:
        '200':
          description: Deleted
  /v1/orders:
    get:
      summary: List orders for current org
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersResponse'
    post:
      summary: Create a staff draft order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftOrderRequest'
      responses:
        '201':
          description: Draft order created, or confirmed when org settings auto_confirm is true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid request or insufficient stock during auto-confirm
  /v1/orders/{orderId}:
    get:
      summary: Get one order with items
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
  /v1/orders/{orderId}/confirm:
    post:
      summary: Confirm an order and atomically decrement stock
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order status or insufficient stock
  /v1/orders/{orderId}/cancel:
    post:
      summary: Cancel an order; confirmed unshipped orders restore stock
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /v1/orders/{orderId}/ship:
    post:
      summary: Mark a confirmed order as shipped
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Shipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /v1/inbox/conversations:
    get:
      summary: List inbox conversations for current org
      responses:
        '200':
          description: OK
  /v1/inbox/conversations/{id}/messages:
    get:
      summary: List inbox messages for a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /v1/inbox/conversations/{id}/takeover:
    post:
      summary: Pause bot and take over an inbox conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Taken over
  /v1/webhooks/meta:
    get:
      summary: Verify Meta webhook subscription
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plain text challenge
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Invalid verify token
    post:
      summary: Ingest Meta webhook events
      parameters:
        - name: x-hub-signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
        '401':
          description: Invalid signature
  /ops/v1/orgs:
    get:
      summary: List orgs (platform admin)
      responses:
        '200':
          description: OK
  /internal/v1/ai/health:
    get:
      summary: Proxy AI health (service key)
      responses:
        '200':
          description: OK
  /internal/v1/ai/runs:
    post:
      summary: Persist an AI run after Core receives an AI response (service key)
      parameters:
        - name: x-service-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteAiRunRequest'
      responses:
        '201':
          description: AI run written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteAiRunResponse'
        '400':
          description: Invalid request or model not allowed
        '401':
          description: Invalid service key
  /internal/v1/tools/get-product:
    post:
      summary: Get one product with variants for AI tooling (service key)
      parameters:
        - name: x-service-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGetProductRequest'
      responses:
        '201':
          description: Product returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGetProductResponse'
        '401':
          description: Invalid service key
        '404':
          description: Product not found for organization
  /internal/v1/tools/create-draft-order:
    post:
      summary: Create a draft order from catalog variants for AI tooling (service key)
      parameters:
        - name: x-service-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiCreateDraftOrderRequest'
      responses:
        '201':
          description: Draft order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCreateDraftOrderResponse'
        '400':
          description: Invalid request or draft total over AI maximum
        '401':
          description: Invalid service key
        '404':
          description: Organization, product, contact, or conversation not found
  /internal/v1/knowledge/chunks:
    post:
      summary: Atomically replace RAG chunks for one knowledge source (service key)
      parameters:
        - name: x-service-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceKnowledgeChunksRequest'
      responses:
        '201':
          description: Chunks replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceKnowledgeChunksResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid service key
        '404':
          description: Knowledge source not found for organization
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    KnowledgeChunkWrite:
      type: object
      required:
        - chunkIndex
        - content
        - contentHash
        - embedding
      properties:
        chunkIndex:
          type: integer
          minimum: 0
        content:
          type: string
          minLength: 1
          maxLength: 20000
        contentHash:
          type: string
          minLength: 1
          maxLength: 128
        embedding:
          type: array
          minItems: 768
          maxItems: 768
          items:
            type: number
            format: double
    ReplaceKnowledgeChunksRequest:
      type: object
      required:
        - orgId
        - sourceType
        - sourceId
        - chunks
      properties:
        orgId:
          type: string
          format: uuid
        sourceType:
          type: string
          enum:
            - product
            - faq
            - policy
        sourceId:
          type: string
          format: uuid
        chunks:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/KnowledgeChunkWrite'
    ReplaceKnowledgeChunksResponse:
      type: object
      required:
        - ok
        - deletedOld
        - inserted
      properties:
        ok:
          type: boolean
        deletedOld:
          type: boolean
        inserted:
          type: integer
          minimum: 0
    ProductVariantWrite:
      type: object
      required:
        - sku
        - title
        - priceVnd
      properties:
        sku:
          type: string
        title:
          type: string
        priceVnd:
          oneOf:
            - type: string
              pattern: '^[0-9]+$'
            - type: integer
              format: int64
          description: Whole VND amount; floats are not accepted.
        stockQty:
          type: integer
          minimum: 0
        attrs:
          type: object
          additionalProperties: true
    OrderStatus:
      type: string
      enum:
        - draft
        - confirmed
        - shipped
        - done
        - cancelled
        - returned
    OrderItemWrite:
      type: object
      required:
        - variantId
        - qty
      properties:
        variantId:
          type: string
          format: uuid
        qty:
          type: integer
          minimum: 1
          maximum: 999
    CreateDraftOrderRequest:
      type: object
      required:
        - items
      properties:
        conversationId:
          type:
            - string
            - 'null'
          format: uuid
        contactId:
          type:
            - string
            - 'null'
          format: uuid
        paymentMethod:
          type: string
          enum:
            - cod
            - bank_transfer
            - other
          default: cod
        customerName:
          type:
            - string
            - 'null'
        phoneE164:
          type:
            - string
            - 'null'
          pattern: '^\+[1-9][0-9]{1,14}$'
        addressText:
          type:
            - string
            - 'null'
        addressJson:
          type: object
          additionalProperties: true
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemWrite'
    OrderItem:
      type: object
      required:
        - id
        - productId
        - variantId
        - titleSnapshot
        - skuSnapshot
        - qty
        - unitPriceVnd
        - lineTotalVnd
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        titleSnapshot:
          type: string
        skuSnapshot:
          type: string
        qty:
          type: integer
          minimum: 1
        unitPriceVnd:
          type: string
          pattern: '^[0-9]+$'
          description: Whole VND amount as a bigint string.
        lineTotalVnd:
          type: string
          pattern: '^[0-9]+$'
          description: Whole VND amount as a bigint string.
    Order:
      type: object
      required:
        - id
        - status
        - paymentMethod
        - currency
        - subtotalVnd
        - totalVnd
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type:
            - string
            - 'null'
          format: uuid
        contactId:
          type:
            - string
            - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentMethod:
          type: string
          enum:
            - cod
            - bank_transfer
            - other
        customerName:
          type:
            - string
            - 'null'
        phoneE164:
          type:
            - string
            - 'null'
          pattern: '^\+[1-9][0-9]{1,14}$'
        addressText:
          type:
            - string
            - 'null'
        addressJson:
          type: object
          additionalProperties: true
        currency:
          type: string
          enum:
            - VND
        subtotalVnd:
          type: string
          pattern: '^[0-9]+$'
          description: Whole VND amount as a bigint string.
        totalVnd:
          type: string
          pattern: '^[0-9]+$'
          description: Whole VND amount as a bigint string.
        idempotencyKey:
          type:
            - string
            - 'null'
        confirmedAt:
          type:
            - string
            - 'null'
          format: date-time
        shippedAt:
          type:
            - string
            - 'null'
          format: date-time
        cancelledAt:
          type:
            - string
            - 'null'
          format: date-time
        doneAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderEnvelope:
      type: object
      required:
        - order
      properties:
        order:
          $ref: '#/components/schemas/Order'
    OrderResponse:
      type: object
      required:
        - order
        - items
      properties:
        order:
          $ref: '#/components/schemas/Order'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    ListOrdersResponse:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    AiProduct:
      type: object
      required:
        - id
        - title
        - status
        - attrs
        - createdAt
        - updatedAt
        - variants
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          type: string
        attrs:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        variants:
          type: array
          items:
            $ref: '#/components/schemas/AiProductVariant'
    AiProductVariant:
      type: object
      required:
        - id
        - productId
        - sku
        - title
        - priceVnd
        - stockQty
        - attrs
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        title:
          type: string
        priceVnd:
          type: string
          pattern: '^[0-9]+$'
          description: Whole VND amount as a bigint string.
        stockQty:
          type: integer
          minimum: 0
        attrs:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AiGetProductRequest:
      type: object
      required:
        - orgId
        - productId
      properties:
        orgId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
    AiGetProductResponse:
      type: object
      required:
        - product
      properties:
        product:
          $ref: '#/components/schemas/AiProduct'
    AiDraftOrderItemWrite:
      type: object
      required:
        - variantId
        - qty
      properties:
        variantId:
          type: string
          format: uuid
        qty:
          type: integer
          minimum: 1
          maximum: 999
    AiCreateDraftOrderRequest:
      type: object
      required:
        - orgId
        - items
      properties:
        orgId:
          type: string
          format: uuid
        conversationId:
          type:
            - string
            - 'null'
          format: uuid
        contactId:
          type:
            - string
            - 'null'
          format: uuid
        paymentMethod:
          type: string
          enum:
            - cod
            - bank_transfer
            - other
          default: cod
        customerName:
          type:
            - string
            - 'null'
        phoneE164:
          type:
            - string
            - 'null'
        addressText:
          type:
            - string
            - 'null'
        addressJson:
          type: object
          additionalProperties: true
        idempotencyKey:
          type:
            - string
            - 'null'
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/AiDraftOrderItemWrite'
    AiCreateDraftOrderResponse:
      type: object
      required:
        - order
        - items
      properties:
        order:
          type: object
          additionalProperties: true
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    WriteAiRunRequest:
      type: object
      required:
        - orgId
        - promptVersion
        - model
        - status
      properties:
        orgId:
          type: string
          format: uuid
        conversationId:
          type:
            - string
            - 'null'
          format: uuid
        messageId:
          type:
            - string
            - 'null'
          format: uuid
        promptVersion:
          type: string
        model:
          type: string
        tokens:
          type: object
          properties:
            prompt:
              type: integer
              minimum: 0
            completion:
              type: integer
              minimum: 0
            input:
              type: integer
              minimum: 0
            output:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        citations:
          type: array
          items:
            type: object
            additionalProperties: true
        status:
          type: string
    WriteAiRunResponse:
      type: object
      required:
        - aiRun
      properties:
        aiRun:
          type: object
          additionalProperties: true
